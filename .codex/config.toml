[[hooks.PreToolUse]]
matcher = "Bash|shell_command|apply_patch"

[[hooks.PreToolUse.hooks]]
type = "command"
command = 'git -c "alias.agent-hook=!bash .agents/hooks/secrets-guard/guard.sh" agent-hook --codex; exit $LASTEXITCODE'
statusMessage = "secrets-guard"

[[hooks.PostToolUse]]
matcher = "apply_patch"

[[hooks.PostToolUse.hooks]]
type = "command"
command = 'git -c "alias.agent-hook=!bash .agents/hooks/light-lint/lint.sh" agent-hook; exit $LASTEXITCODE'
statusMessage = "light-lint"
